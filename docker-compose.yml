version: '3.8'

services:
  teslacam-studio:
    image: ghcr.io/rodolfoconcepcion/tdashcamstudio:latest
    container_name: teslacam-studio
    ports:
      - "8188:80"
    restart: unless-stopped
    environment:
      - TZ=America/Santo_Domingo
    networks:
      - tdascam-network

networks:
  tdascam-network:
    driver: bridge
